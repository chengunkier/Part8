name: E2E Tests - Chapter 5

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chapter5-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: Run Chapter 5 E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            library-backend/package-lock.json
            library-frontend/package-lock.json
            tests-chapter5/package-lock.json

      - name: Install backend dependencies
        working-directory: library-backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: library-frontend
        run: npm ci

      - name: Install E2E test dependencies
        working-directory: tests-chapter5
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests-chapter5
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: tests-chapter5
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests-chapter5/playwright-report/
          retention-days: 7
name: Test Chapter 4

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chapter4-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Chapter 4 tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            library-backend/package-lock.json
            tests-chapter4/package-lock.json

      - name: Install backend dependencies
        working-directory: library-backend
        run: npm ci

      - name: Install test dependencies
        working-directory: tests-chapter4
        run: npm ci

      - name: Run Chapter 4 tests
        working-directory: tests-chapter4
        run: npm test